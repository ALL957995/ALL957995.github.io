<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的网盘资源站</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; padding: 30px; }
    .container { max-width: 750px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; font-size: 32px; }

    /* 分类导航 */
    .category-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }
    .category-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s;
    }
    .category-btn:hover { border-color: #4f46e5; color: #4f46e5; }
    .category-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }

    /* 搜索框 */
    .search-box {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }
    .search-box input {
      width: 100%;
      max-width: 400px;
      padding: 12px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-box input:focus { border-color: #4f46e5; }

    .card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 6px 16px rgba(0,0,0,0.05); }
    .card-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
    .platform-tag { display: inline-block; background: #eef2ff; color: #4f46e5; padding: 3px 12px; border-radius: 20px; font-size: 13px; margin-bottom: 16px; }
    .copy-btn { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; transition: background 0.3s; }
    .copy-btn:hover { background: #4338ca; }

    .no-result { text-align: center; color: #999; margin-top: 40px; font-size: 16px; display: none; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 40px; opacity: 0; transition: opacity 0.3s; z-index: 999; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 资源分享</h1>

    <!-- 分类按钮 -->
    <div class="category-nav">
      <button class="category-btn active" data-category="全部">全部</button>
      <button class="category-btn" data-category="电影">电影</button>
      <button class="category-btn" data-category="剧集">剧集</button>
      <button class="category-btn" data-category="动画">动画</button>
      <button class="category-btn" data-category="游戏">游戏</button>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索资源名称..." autofocus>
    </div>

    <div id="list"></div>
    <div id="noResult" class="no-result">😕 没有找到相关资源</div>
  </div>

  <div id="toast" class="toast">✅ 链接已复制到剪贴板</div>

  <script>
    let allResources = [];
    let currentCategory = '全部';   // 当前选中的分类

    // 加载数据
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        allResources = data;
        applyFilters();   // 初次加载显示全部
      })
      .catch(() => {
        document.getElementById('list').innerHTML = '<p style="text-align:center;color:#999;">加载失败，请刷新</p>';
      });

    // 渲染列表
    function renderList(resources) {
      const list = document.getElementById('list');
      const noResult = document.getElementById('noResult');
      list.innerHTML = '';

      if (!resources.length) {
        noResult.style.display = 'block';
      } else {
        noResult.style.display = 'none';
      }

      resources.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${item.title}</div>
          <span class="platform-tag">${item.platform || '网盘'}</span>
          <button class="copy-btn">📋 一键复制链接和提取码</button>
        `;
        const copyText = `链接：${item.link}${item.code ? ' 提取码：' + item.code : ''}`;
        card.querySelector('.copy-btn').addEventListener('click', () => {
          navigator.clipboard.writeText(copyText).then(() => {
            const t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
          });
        });
        list.appendChild(card);
      });
    }

    // 根据分类 + 搜索词过滤
    function applyFilters() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      
      let filtered = allResources;
      
      // 1. 分类过滤
      if (currentCategory !== '全部') {
        filtered = filtered.filter(item => item.category === currentCategory);
      }
      
      // 2. 搜索过滤
      if (keyword) {
        filtered = filtered.filter(item => item.title.toLowerCase().includes(keyword));
      }
      
      renderList(filtered);
    }

    // 搜索框监听
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // 分类按钮点击事件
    const categoryBtns = document.querySelectorAll('.category-btn');
    categoryBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        // 移除所有按钮的active样式
        categoryBtns.forEach(b => b.classList.remove('active'));
        // 给当前点击的按钮加active样式
        this.classList.add('active');
        // 更新当前分类
        currentCategory = this.getAttribute('data-category');
        // 重新过滤
        applyFilters();
      });
    });
  </script>
</body>
</html>
